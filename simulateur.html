(function(){

  function lu(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function ec(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
  function base(c){ c = String(c||'').toLowerCase().replace(/_/g,'-'); var b = c.split('-')[0]; return ALIAS[b]||b; }
  function connue(b){ return b === 'bzh' || L.indexOf(b) >= 0; }
  /* Le choix d'une langue, mémorisé pour toutes les pages. Le breton garde le texte français. */
  function retenir(v){
    if(v === 'auto'){ ec('sm-bzh', null); ec('sm-langue', 'auto'); }
    else if(v === 'bzh'){ ec('sm-bzh', '1'); ec('sm-langue', 'fr'); }
    else { ec('sm-bzh', null); ec('sm-langue', v); }
  }
  window.smLangue = function(){
    /* 1. l'adresse demandée */
    var q = null; try{ q = new URLSearchParams(location.search).get('lang'); }catch(e){}
    if(q){ var b = base(q); if(connue(b)){ retenir(b); return b; } }
    /* 2. le choix du visiteur, s'il en a fait un */
    var v = lu('sm-langue');
    if(v && v !== 'auto' && connue(v)) return (v === 'fr' && lu('sm-bzh') === '1') ? 'bzh' : v;
    /* 3. le français, toujours : aucune détection par le navigateur (25/11/2026) */
    return 'fr';

  try{
    var retenu = window.smLangue();
    document.documentElement.setAttribute('data-sm-langue', retenu);
    if(retenu !== 'bzh') document.documentElement.setAttribute('lang', retenu);
  }catch(e){}
})();

pow":"Sidelights without a masthead light show a sailing vessel: you, under power, keep out of the way whichever colour you see (COLREG rules 18 and 25).","lfish":"Red over white means a vessel fishing: the sailing vessel keeps out of the way (COLREG rules 18 and 26).","lnuc":"Two red lights one above the other mean a vessel not under command: you keep out of the way (COLREG rules 18 and 27)."},"de":{"r10":"Auf verschiedenen Bugs hält das Boot auf Backbordbug Abstand vom Boot auf Steuerbordbug (Regel 10).","r10b":"An der Luvtonne gilt Regel 18 nicht zwischen Booten auf verschiedenen Bugs: Regel 10 entscheidet, Backbord weicht aus.","r11":"Auf gleichem Bug und überlappend hält das Luvboot Abstand vom Leeboot (Regel 11).","r12":"Auf gleichem Bug ohne Überlappung hält das hintere Boot Abstand vom vorderen (Regel 12).","r13":"Nach dem Durchgang durch den Wind hält das wendende Boot Abstand von allen anderen, bis es am Wind segelt (Regel 13).","r14":"Auch mit Wegerecht muss ein Boot einen Zusammenstoß vermeiden, sobald klar ist, dass das andere nicht ausweicht (Regel 14).","r15":"Ein Boot, das durch Wende oder Halse Wegerecht erlangt, muss dem anderen zunächst Raum zum Ausweichen geben (Regel 15).","r16a":"Ein Boot mit Wegerecht, das den Kurs ändert, muss dem anderen Raum zum Ausweichen lassen (Regel 16.1).","r16b":"Das Steuerbordboot darf den Kurs nicht ändern, wenn das hinter ihm durchgehende Backbordboot dann erneut ausweichen müsste (Regel 16.2).","r23":"Wenn möglich muss ein Boot ein gekentertes, geankertes oder aufgelaufenes Boot meiden, auch mit Wegerecht (Regel 23.1).","r18o":"Sind die Boote überlappt, wenn das erste die Drei-Längen-Zone erreicht, gibt das äußere Boot dem inneren Raum an der Marke (Regel 18.2).","r18b":"Ohne Überlappung beim Erreichen der Zone gibt das hintere Boot dem vorderen Raum an der Marke (Regel 18.2).","r19":"Überlappt an einem Hindernis gibt das äußere Boot dem inneren Raum zwischen sich und dem Hindernis (Regel 19.2).","r20":"Ein Boot, das wegen eines Hindernisses wenden muss, darf „Raum zum Wenden“ rufen; das andere muss wenden oder „Du wendest“ antworten (Regel 20).","c12a":"Zwei Segelfahrzeuge mit Wind von verschiedenen Seiten: das mit Wind von Backbord weicht aus (KVR Regel 12).","c12b":"Zwei Segelfahrzeuge mit Wind von derselben Seite: das Luvfahrzeug weicht dem Leefahrzeug aus (KVR Regel 12).","c13":"Das überholende Fahrzeug weicht aus, ob unter Segel oder Motor (KVR Regel 13).","c14":"Zwei Maschinenfahrzeuge auf entgegengesetzten Kursen weichen beide nach Steuerbord aus (KVR Regel 14).","c15":"Zwei kreuzende Maschinenfahrzeuge: das, das das andere an Steuerbord hat, weicht aus (KVR Regel 15).","c18a":"Ein Maschinenfahrzeug weicht einem Segelfahrzeug aus, egal auf welchem Bug oder von welcher Seite (KVR Regel 18).","c18f":"Ein Segelfahrzeug weicht einem fischenden Fahrzeug aus (KVR Regel 18).","c9":"In einem engen Fahrwasser oder einer Hafeneinfahrt darf ein Segelfahrzeug ein Fahrzeug nicht behindern, das nur innerhalb des Fahrwassers sicher fahren kann (KVR Regel 9).","c9d":"In einem engen Fahrwasser hält jedes Fahrzeug sich an der Steuerbordseite und passiert Backbord an Backbord (KVR Regel 9).","c25":"Eine Segelyacht unter Motor ist ein Maschinenfahrzeug: Sie weicht dem Segler unter Segeln aus (KVR Regeln 3 und 18).","lred":"Du siehst sein rotes Backbordlicht: Es kreuzt von deiner Steuerbordseite, also weichst du aus (KVR Regeln 15 und 21).","lgreen":"Du siehst sein grünes Steuerbordlicht: Es kreuzt von deiner Backbordseite, es weicht aus und du behältst den Kurs (KVR Regeln 15 und 17).","lhead":"Rot, Grün und Topplicht zugleich: ihr seid auf Gegenkurs, beide weichen nach Steuerbord aus (KVR Regel 14).","lstern":"Du siehst nur sein weißes Hecklicht: Du überholst, also weichst du aus (KVR Regeln 13 und 21).","lsailpow":"Seitenlichter ohne Topplicht zeigen ein Segelfahrzeug: Du als Maschinenfahrzeug weichst aus, egal welche Farbe du siehst (KVR Regeln 18 und 25).","lfish":"Rot über Weiß bedeutet ein fischendes Fahrzeug: Das Segelfahrzeug weicht aus (KVR Regeln 18 und 26).","lnuc":"Zwei rote Lichter übereinander bedeuten ein manövrierunfähiges Fahrzeug: Du weichst aus (KVR Regeln 18 und 27)."},"it":{"r10":"Su mure opposte, la barca mure a sinistra lascia strada a quella mure a dritta (regola 10).","r10b":"Alla boa di bolina la regola 18 non vale tra barche su mure opposte: decide la regola 10, la mure a sinistra lascia strada.","r11":"Sulla stessa mura e in sovrapposizione, la barca sopravento lascia strada a quella sottovento (regola 11).","r12":"Sulla stessa mura e senza sovrapposizione, la barca dietro lascia strada a quella davanti (regola 12).","r13":"Dopo aver passato la prua al vento, la barca che vira lascia strada alle altre finché non è di bolina (regola 13).","r14":"Anche con la precedenza, una barca deve evitare il contatto appena è chiaro che l'altra non si scosta (regola 14).","r15":"Una barca che ottiene la precedenza virando o strambando deve prima lasciare all'altra lo spazio per scostarsi (regola 15).","r16a":"Una barca con la precedenza che cambia rotta deve lasciare all'altra lo spazio per scostarsi (regola 16.1).","r16b":"La barca mure a dritta non deve cambiare rotta se quella mure a sinistra che passa a poppa dovesse allora manovrare di nuovo (regola 16.2).","r23":"Se possibile, una barca deve evitare una barca scuffiata, all'ancora o incagliata, anche se ha la precedenza (regola 23.1).","r18o":"Se le barche sono sovrapposte quando la prima entra nella zona delle tre lunghezze, quella esterna dà spazio alla boa a quella interna (regola 18.2).","r18b":"Senza sovrapposizione all'ingresso nella zona, la barca dietro dà spazio alla boa a quella davanti (regola 18.2).","r19":"In sovrapposizione a un ostacolo, la barca esterna lascia alla interna lo spazio per passare tra sé e l'ostacolo (regola 19.2).","r20":"Una barca che deve virare per evitare un ostacolo può chiamare «Spazio per virare»; l'altra deve virare o rispondere «Vira tu» (regola 20).","c12a":"Due barche a vela con il vento da lati diversi: quella con il vento a sinistra si tiene fuori rotta (RIPAM regola 12).","c12b":"Due barche a vela con il vento dallo stesso lato: quella sopravento si tiene fuori rotta da quella sottovento (RIPAM regola 12).","c13":"La barca che raggiunge un'altra si tiene fuori rotta, a vela o a motore (RIPAM regola 13).","c14":"Due unità a motore che si incontrano prua contro prua accostano entrambe a dritta (RIPAM regola 14).","c15":"Due unità a motore che si incrociano: quella che ha l'altra sulla propria dritta si tiene fuori rotta (RIPAM regola 15).","c18a":"Un'unità a motore si tiene fuori rotta da una barca a vela, qualunque sia la mura o il lato da cui arriva (RIPAM regola 18).","c18f":"Una barca a vela si tiene fuori rotta da un'unità che sta pescando (RIPAM regola 18).","c9":"In un canale stretto o all'imboccatura di un porto, una barca a vela non deve ostacolare un'unità che può navigare solo all'interno del canale (RIPAM regola 9).","c9d":"In un canale stretto ognuno tiene la propria dritta e si incrocia sinistra con sinistra (RIPAM regola 9).","c25":"Una barca a vela che va a motore è un'unità a motore: si tiene fuori rotta da quella che naviga a vela (RIPAM regole 3 e 18).","lred":"Vedi il suo fanale rosso di sinistra: ti incrocia da dritta, quindi devi scostarti tu (RIPAM regole 15 e 21).","lgreen":"Vedi il suo fanale verde: ti incrocia da sinistra, deve scostarsi lui e tu mantieni la rotta (RIPAM regole 15 e 17).","lhead":"Rosso, verde e fanale di testa d'albero insieme: siete prua contro prua, accostate entrambi a dritta (RIPAM regola 14).","lstern":"Vedi solo il suo fanale bianco di poppa: lo stai raggiungendo, quindi ti scosti tu (RIPAM regole 13 e 21).","lsailpow":"Fanali di via senza luce di testa d'albero indicano una barca a vela: tu, a motore, ti scosti qualunque colore tu veda (RIPAM regole 18 e 25).","lfish":"Rosso sopra bianco indica un'unità che pesca: la barca a vela si scosta (RIPAM regole 18 e 26).","lnuc":"Due fanali rossi in verticale indicano una nave non governata: ti scosti tu (RIPAM regole 18 e 27)."},"es":{"r10":"En amuras opuestas, el barco amurado a babor se aparta del amurado a estribor (regla 10).","r10b":"En la baliza de barlovento la regla 18 no se aplica entre amuras opuestas: decide la regla 10, babor se aparta.","r11":"En la misma amura y con overlap, el barco de barlovento se aparta del de sotavento (regla 11).","r12":"En la misma amura y sin overlap, el barco de atrás se aparta del de delante (regla 12).","r13":"Tras pasar por la proa al viento, el barco que vira se aparta de los demás hasta que navega de ceñida (regla 13).","r14":"Incluso con derecho de paso, un barco debe evitar el contacto en cuanto está claro que el otro no se aparta (regla 14).","r15":"Un barco que adquiere derecho de paso virando o trasluchando debe dar primero al otro espacio para apartarse (regla 15).","r16a":"Un barco con derecho de paso que cambia de rumbo debe dar al otro espacio para apartarse (regla 16.1).","r16b":"El barco de estribor no debe cambiar de rumbo si el de babor que pasa por su popa tuviera que maniobrar de nuevo (regla 16.2).","r23":"Si es posible, un barco debe evitar a otro volcado, fondeado o varado, aunque tenga derecho de paso (regla 23.1).","r18o":"Si los barcos están con overlap cuando el primero entra en la zona de tres esloras, el exterior da espacio en la baliza al interior (regla 18.2).","r18b":"Sin overlap a la entrada de la zona, el barco de atrás da espacio en la baliza al de delante (regla 18.2).","r19":"Con overlap en un obstáculo, el barco exterior da al interior espacio para pasar entre él y el obstáculo (regla 19.2).","r20":"Un barco que debe virar para evitar un obstáculo puede gritar «Espacio para virar»; el otro debe virar o responder «Vira tú» (regla 20).","c12a":"Dos veleros con el viento por bandas distintas: el que lo recibe por babor se aparta (RIPA regla 12).","c12b":"Dos veleros con el viento por la misma banda: el de barlovento se aparta del de sotavento (RIPA regla 12).","c13":"El buque que alcanza a otro se aparta, vaya a vela o a motor (RIPA regla 13).","c14":"Dos buques de propulsión mecánica que se encuentran de vuelta encontrada caen ambos a estribor (RIPA regla 14).","c15":"Dos buques de propulsión mecánica que se cruzan: el que ve al otro por su estribor se aparta (RIPA regla 15).","c18a":"Un buque de propulsión mecánica se aparta de un velero, sea cual sea la amura o el lado por el que llegue (RIPA regla 18).","c18f":"Un velero se aparta de un buque dedicado a la pesca (RIPA regla 18).","c9":"En un canal estrecho o a la entrada de un puerto, un velero no debe estorbar a un buque que solo puede navegar por dentro del canal (RIPA regla 9).","c9d":"En un canal estrecho cada buque navega por su estribor y se cruza babor con babor (RIPA regla 9).","c25":"Un velero que navega a motor es un buque de propulsión mecánica: se aparta del que navega a vela (RIPA reglas 3 y 18).","lred":"Ves su luz roja de babor: te cruza por tu estribor, así que te apartas tú (RIPA reglas 15 y 21).","lgreen":"Ves su luz verde de estribor: te cruza por tu babor, se aparta él y tú mantienes el rumbo (RIPA reglas 15 y 17).","lhead":"Rojo, verde y luz de tope a la vez: estáis de vuelta encontrada, caed ambos a estribor (RIPA regla 14).","lstern":"Solo ves su luz blanca de alcance: lo estás alcanzando, así que te apartas tú (RIPA reglas 13 y 21).","lsailpow":"Luces de costado sin luz de tope indican un velero: tú, a motor, te apartas veas el color que veas (RIPA reglas 18 y 25).","lfish":"Rojo sobre blanco indica un buque pescando: el velero se aparta (RIPA reglas 18 y 26).","lnuc":"Dos luces rojas en vertical indican un buque sin gobierno: te apartas tú (RIPA reglas 18 y 27)."},"pt":{"r10":"Em amuras opostas, o barco amurado a bombordo afasta-se do amurado a estibordo (regra 10).","r10b":"Na bóia de barlavento a regra 18 não se aplica entre amuras opostas: decide a regra 10, bombordo afasta-se.","r11":"Na mesma amura e com sobreposição, o barco de barlavento afasta-se do de sotavento (regra 11).","r12":"Na mesma amura e sem sobreposição, o barco de trás afasta-se do da frente (regra 12).","r13":"Depois de passar com a proa ao vento, o barco que vira afasta-se dos outros até estar de bolina (regra 13).","r14":"Mesmo com prioridade, um barco deve evitar o contacto assim que é claro que o outro não se afasta (regra 14).","r15":"Um barco que ganha prioridade ao virar ou ao jibar deve primeiro dar ao outro espaço para se afastar (regra 15).","r16a":"Um barco com prioridade que muda de rumo deve dar ao outro espaço para se afastar (regra 16.1).","r16b":"O barco de estibordo não deve mudar de rumo se o de bombordo que passa por sua popa tivesse de manobrar outra vez (regra 16.2).","r23":"Se possível, um barco deve evitar outro virado, fundeado ou encalhado, mesmo com prioridade (regra 23.1).","r18o":"Se os barcos estão sobrepostos quando o primeiro entra na zona dos três comprimentos, o exterior dá espaço na bóia ao interior (regra 18.2).","r18b":"Sem sobreposição à entrada da zona, o barco de trás dá espaço na bóia ao da frente (regra 18.2).","r19":"Com sobreposição num obstáculo, o barco exterior dá ao interior espaço para passar entre ele e o obstáculo (regra 19.2).","r20":"Um barco que tem de virar para evitar um obstáculo pode gritar «Espaço para virar»; o outro deve virar ou responder «Vira tu» (regra 20).","c12a":"Dois veleiros com o vento de bordos diferentes: o que o recebe por bombordo afasta-se (RIPEAM regra 12).","c12b":"Dois veleiros com o vento do mesmo bordo: o de barlavento afasta-se do de sotavento (RIPEAM regra 12).","c13":"O barco que ultrapassa outro afasta-se, seja à vela ou a motor (RIPEAM regra 13).","c14":"Dois barcos a motor que se cruzam de roda a roda guinam ambos para estibordo (RIPEAM regra 14).","c15":"Dois barcos a motor que se cruzam: o que tem o outro por estibordo afasta-se (RIPEAM regra 15).","c18a":"Um barco a motor afasta-se de um veleiro, qualquer que seja a amura ou o lado de onde venha (RIPEAM regra 18).","c18f":"Um veleiro afasta-se de um barco que está a pescar (RIPEAM regra 18).","c9":"Num canal estreito ou à entrada de um porto, um veleiro não deve estorvar um barco que só pode navegar dentro do canal (RIPEAM regra 9).","c9d":"Num canal estreito cada barco mantém-se a estibordo e cruza-se bombordo com bombordo (RIPEAM regra 9).","c25":"Um veleiro a motor é um barco a motor: afasta-se do que navega à vela (RIPEAM regras 3 e 18).","lred":"Vês a sua luz vermelha de bombordo: cruza-te por estibordo, por isso afastas-te tu (RIPEAM regras 15 e 21).","lgreen":"Vês a sua luz verde de estibordo: cruza-te por bombordo, ele afasta-se e tu manténs o rumo (RIPEAM regras 15 e 17).","lhead":"Vermelho, verde e luz de topo ao mesmo tempo: estão de roda a roda, guinem ambos para estibordo (RIPEAM regra 14).","lstern":"Só vês a sua luz branca de popa: estás a ultrapassá-lo, por isso afastas-te tu (RIPEAM regras 13 e 21).","lsailpow":"Luzes de bordo sem luz de topo indicam um veleiro: tu, a motor, afastas-te seja qual for a cor que vês (RIPEAM regras 18 e 25).","lfish":"Vermelho sobre branco indica um barco a pescar: o veleiro afasta-se (RIPEAM regras 18 e 26).","lnuc":"Duas luzes vermelhas na vertical indicam um barco sem governo: afastas-te tu (RIPEAM regras 18 e 27)."}},"sc":[{"id":1,"fam":"rrs","reason":"r10","boats":[{"id":"A","k":"s","x":74.0,"y":69.0,"h":315},{"id":"B","k":"s","x":26.0,"y":69.0,"h":45}],"ans":"B","ref":"10","rule":10,"wind":true,"night":false},{"id":2,"fam":"rrs","reason":"r10","boats":[{"id":"A","k":"s","x":26.0,"y":69.0,"h":45},{"id":"B","k":"s","x":74.0,"y":69.0,"h":315}],"ans":"A","ref":"10","rule":10,"wind":true,"night":false},{"id":3,"fam":"rrs","reason":"r10","boats":[{"id":"A","k":"s","x":71.2,"y":38.8,"h":225},{"id":"B","k":"s","x":28.8,"y":38.8,"h":135}],"ans":"B","ref":"10","rule":10,"wind":true,"night":false},{"id":4,"fam":"rrs","reason":"r10","boats":[{"i  if(l&&LANGS.indexOf(l[1])>=0)L=l[1];else{var n=(window.smLangue?window.smLangue():(navigator.language||'en')).slice(0,2);if(n==='bz')n='fr';if(LANGS.indexOf(n)>=0)L=n;}
 liste();
 if(m){var id=parseInt(m[1],10);for(var i=0;i<ordre.length;i++){if(SC[ordre[i]].id===id)pos=i;}}}
document.addEventListener('click',function(e){
 var b=e.target.closest?e.target.closest('button'):null;if(!b)return;
 if(b.hasAttribute('data-r'))return repondre(b.getAttribute('data-r'));
 if(b.hasAttribute('data-l')){L=b.getAttribute('data-l');maj();rendre2();return;}
 if(b.hasAttribute('data-f')){filtre=b.getAttribute('data-f');pos=0;liste();rendre();return;}
 if(b.id==='prec'){pos=(pos-1+ordre.length)%ordre.length;rendre();}
 else if(b.id==='suiv'){pos=(pos+1)%ordre.length;rendre();}
 else if(b.id==='alea'){pos=Math.floor(Math.random()*ordre.length);rendre();}
 else if(b.id==='lien'){var u=location.origin+location.pathname+'#s='+cur().id+'&l='+L;
  if(navigator.share){navigator.share({title:t('titre'),url:u}).catch(function(){});}
  else if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){b.textContent=t('copie');});}
  else{window.prompt(t('lien'),u);}}
});
function rendre2(){ // changement de langue : on garde le scénario et l'état de réponse
 var s=cur(),was=repondu,r=$('rep').querySelector('.mal');
 $('num').textContent=t('scn')+' '+s.id+' / '+SC.length;
 $('badge').textContent=(s.fam==='rrs'?'RRS ':t('col')+' ')+s.ref;
 $('panneau').innerHTML=panneau(s);$('question').textContent=t('question');
 var m=$('rep').querySelector('.bon'),pris=m?(r?r.getAttribute('data-r'):s.ans):null;
 $('rep').innerHTML='<button data-r="A">'+esc(t('repA'))+'</button><button data-r="B">'+esc(t('repB'))+'</button><button data-r="AB">'+esc(t('repAB'))+'</button>';
 if(was){repondu=false;tot--;if(pris===s.ans)ok--;repondre(pris);}
 histo();}
depuisHash();rendre();
})();

<style>
/* ---- la mer en fond : fixe, derrière tout le contenu (Nicolas, 19/11/2026) ---- */
.mer-fond{position:fixed;inset:0;z-index:0;overflow:hidden;background:#071c31;
  isolation:isolate;pointer-events:none}
.mer-fond canvas{position:absolute;inset:0;width:100%;height:100%;display:block;
  opacity:0;transition:opacity 1.1s cubic-bezier(.23,1,.32,1);cursor:grab;pointer-events:auto}
.mer-fond.pret canvas{opacity:1}
.mer-fond.fondu canvas{opacity:0;transition-duration:.22s}
/* voile : l'eau reste visible comme fond, le texte reste lisible par-dessus */
.mer-fond .mer-ombre{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 85% at 50% 28%,rgba(5,16,30,.20) 0%,rgba(5,16,30,.34) 55%,rgba(5,16,30,.52) 100%),
             linear-gradient(180deg,rgba(6,18,33,.30) 0%,rgba(6,18,33,.12) 30%,rgba(6,18,33,.40) 78%,rgba(5,15,28,.62) 100%)}
.contenu{position:relative;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,18,33,0) 0,rgba(6,18,33,0) 62vh,
    rgba(6,18,33,.55) 96vh,rgba(6,18,33,.55) 100%)}

/* les commandes de la scène : posées sur la mer, elles s'effacent dès qu'on descend */
.mer-fond .heure,.mer-fond .choix,.mer-fond .vent,.mer-fond .legende,.mer-fond .rejouer{
  transition:opacity .45s ease,transform .45s ease}
.mer-fond.loin .heure,.mer-fond.loin .choix,.mer-fond.loin .vent,.mer-fond.loin .legende,
.mer-fond.loin .rejouer{opacity:0;pointer-events:none;transform:translateY(-6px)}

/* Le tableau de bord détaché des pages annexes : mêmes commandes, hors de la couche du fond
   (z-index -1) qui les rendrait invisibles et incliquables. */
.mer-fond.mer-fond-commandes{position:relative;inset:auto;height:auto;width:100%;max-width:100%;
  background:none;overflow:visible;z-index:60;pointer-events:none;display:flex;flex-direction:column;
  align-items:flex-start;gap:.55rem;padding:1rem 1.1rem .2rem}
.mer-fond.mer-fond-commandes .heure,.mer-fond.mer-fond-commandes .choix{position:relative!important;
  left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;
  margin:0!important;pointer-events:auto}
.mer-fond .heure{position:absolute;left:14px;top:80px;z-index:4;height:46px;padding:0 8px 0 14px;
  display:flex;align-items:center;gap:10px;border-radius:999px;width:min(360px,calc(100% - 28px));
  background:rgba(6,18,33,.66);color:var(--creme,#f4efe4);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);pointer-events:auto}
.mer-fond .heure .lue{flex:none;min-width:4.6em;font-size:14px;font-weight:600;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.mer-fond .heure .piste{flex:1 1 auto;min-width:0;height:42px;margin:0;background:transparent;
  cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:none;outline:none}
.mer-fond .heure .piste::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0b1730 0%,#0b1730 21%,#d9879a 27%,#f2c48a 31%,#6fb1e6 42%,#3f97e6 56%,#7fb6e0 72%,#f5b56b 81%,#d9694f 85%,#3a2c55 89%,#0b1730 93%,#0b1730 100%)}
.mer-fond .heure .piste::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#0b1730 0%,#0b1730 21%,#d9879a 27%,#f2c48a 31%,#6fb1e6 42%,#3f97e6 56%,#7fb6e0 72%,#f5b56b 81%,#d9694f 85%,#3a2c55 89%,#0b1730 93%,#0b1730 100%)}
.mer-fond .heure .piste::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;
  margin-top:-7px;border-radius:50%;background:var(--creme,#f4efe4);border:0;box-shadow:0 1px 5px rgba(0,0,0,.5)}
.mer-fond .heure .piste::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--creme,#f4efe4);

.mer-fond .heure .auto{flex:none;display:flex;align-items:center;gap:6px;height:34px;padding:0 11px 0 9px;

/* le choix du bateau */
.mer-fond .choix{position:absolute;left:14px;top:80px;z-index:4;display:flex;flex-direction:column;
  align-items:stretch;gap:4px;padding:4px;border-radius:22px;background:rgba(6,18,33,.66);

.mer-fond .vent{display:none!important}
/* le cadran du vent, en bas à droite */
.mer-fond .vent{position:absolute;right:16px;top:50%;transform:translateY(-50%);z-index:4;width:104px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--creme,#f4efe4);text-align:center;
  pointer-events:auto}
.mer-fond .vent .cadran{width:96px;height:96px;border-radius:50%;background:rgba(6,18,33,.62);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);touch-action:none;cursor:grab;outline:none;

.mer-fond .vent .geste{font-size:10.5px;color:#c3d2e0;text-shadow:0 1px 4px rgba(0,0,0,.85)}

/* la légende de la manœuvre, en bas à gauche */
.mer-fond .legende{position:absolute;left:14px;bottom:14px;z-index:4;width:min(330px,calc(100% - 150px));
  background:rgba(6,18,33,.66);color:var(--creme,#f4efe4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:12px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:4px;text-align:left;
  pointer-events:auto}
.mer-fond .legende .oeil{margin:0;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#a8bccc}
.mer-fond .legende .phase{margin:0;font-weight:700;font-size:17px;line-height:1.2;min-height:1.2em}
.mer-fond .legende .detail{margin:0;font-size:12.5px;line-height:1.35;color:#b9cbdc;min-height:2.7em}
.mer-fond .instruments{display:flex;gap:16px;margin:5px 0 0;padding:7px 0 0;
  border-top:1px solid rgba(255,255,255,.16)}
.mer-fond .instruments div{display:flex;flex-direction:column;min-width:0}
.mer-fond .instruments dt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#a8bccc}
.mer-fond .instruments dd{margin:0;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;white-space:nowrap}
.mer-fond .instruments dd small{font-size:10.5px;font-weight:500;color:#a8bccc;margin-left:2px}

.mer-fond .rejouer{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:4;
  font:600 13.5px/1 system-ui,sans-serif;color:#08162a;background:var(--creme,#f4efe4);border:0;border-radius:999px;
  padding:10px 17px;min-height:42px;cursor:pointer;pointer-events:auto}
.mer-fond .rejouer:active{transform:translateX(-50%) scale(.97)}
.mer-fond .secours{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;text-align:center;color:var(--creme,#f4efe4);z-index:2}

/* le héros : plus qu'un texte posé sur l'eau */
.hero.hero-mer{position:relative;max-width:none;margin:0;padding:0;text-align:center;

.contenu a,.contenu button,.contenu input,.contenu select,.contenu textarea,
.contenu summary,.contenu [tabindex],.contenu video,.contenu audio{pointer-events:auto}

@media (max-width:820px){
  .mer-fond .choix{left:10px;top:64px}
